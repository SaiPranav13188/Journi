# Render Blueprint — New → Blueprint → select this repo (rootDir: backend).
services:
  - type: web
    name: journi-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-3.5-flash
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: HTTP_USER_AGENT
        sync: false
      - key: AGENTIC_WEATHER_WATCHER
        value: "true"
      - key: EVAL_SECRET
        generateValue: true
